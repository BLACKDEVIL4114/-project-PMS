name: PMS CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Code Quality & Security Scan
  # ─────────────────────────────────────────────
  lint-and-security:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint & security tools
        run: |
          pip install flake8 bandit pylint

      - name: Run Flake8 (Style)
        run: |
          flake8 . --count --max-line-length=120 --exclude=__pycache__,backend \
            --ignore=E501,W503,E302,E303 --statistics || true

      - name: Run Bandit (Security Scan)
        run: |
          bandit -r . -x ./backend,./venv --severity-level medium -f txt || true

  # ─────────────────────────────────────────────
  # JOB 2: Run Tests
  # ─────────────────────────────────────────────
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run API unit tests
        run: |
          python -m pytest tests.py -v --tb=short 2>&1 || echo "Tests completed"

  # ─────────────────────────────────────────────
  # JOB 3: Dependency Audit
  # ─────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for CVEs
        run: |
          pip-audit -r requirements.txt --format=json 2>&1 || true
